server {
    listen       8080;
    server_name  _;

    # Ne pas divulguer la version de nginx
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Seules les méthodes utiles à un site statique sont autorisées
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers cachés (.git, .env...) : jamais servis
    location ~ /\. {
        deny all;
        return 404;
    }

    # Sonde utilisée par le HEALTHCHECK
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
